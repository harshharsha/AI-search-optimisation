name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Placeholders: the build and the tests do not connect to a database
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aisoa
      APP_PASSWORD: ci-password
      AUTH_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint --if-present
      - run: npm test
      - run: npm run build
